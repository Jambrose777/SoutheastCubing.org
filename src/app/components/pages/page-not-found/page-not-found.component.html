<div class="component-container">
  <div class="main-pane">
    <header id="header" [title]="title" [activateNavOnDefault]="true"></header>
    @if (isMobile) {
      @if (loadingContent) {
        <loading-spinner></loading-spinner>
      }
      @if (!loadingContent) {
        <div class="large-text-content">
          <markdown [data]="description"></markdown>
        </div>
      }
    }
  </div>
  @if (!isMobile) {
    <div class="secondary-pane">
      <!-- Loading Spinner -->
      @if (loadingContent) {
        <loading-spinner></loading-spinner>
      }
      @if (!loadingContent && !isMobile) {
        <div class="large-text-content">
          <markdown [data]="description"></markdown>
        </div>
      }
    </div>
  }
</div>
