<div class="event-container">
  @for (event of Events; track event) {
    <span
      [ngClass]="'cubing-icon event-' + event"
      (click)="eventClicked(event)"
      (keydown.enter)="eventClicked(event)"
      (keydown.space)="$event.preventDefault(); eventClicked(event)"
      [style.color]="eventColors()[event]"
      [matTooltip]="EventNames[event]"
      matTooltipPosition="above"
      [attr.aria-label]="EventNames[event]"
      role="button"
      tabindex="0"
    ></span>
  }
</div>
