<div class="header">
  <img
    ngSrc="assets/SECILogoColor-header.png"
    width="240"
    height="120"
    priority
    class="se-logo"
    [routerLink]="'/home'"
  />
  <h1 class="se-title" [ngClass]="{ 'medium-se-title': useMediumBreakpoint() }">{{ title() }}</h1>

  <!-- Close Icon for when the nav is open -->
  @if (isNavActive() && !isMobile() && !activateNavOnDefault()) {
    <i class="close-icon fa-solid fa-close fa-2xl clickable" (click)="toggleNav(false)"></i>
  }

  <!-- Nav system -->
  @if (!isMobile()) {
    <div class="nav-container" [ngClass]="{ active: isNavActive(), transition: transition() }">
      <se-nav
        [isNavActive]="isNavActive()"
        [transition]="transition()"
        (toggleNavEmitter)="toggleNav($event)"
        (transitionEndEmitter)="onTransitionEnd()"
      ></se-nav>
      @if (!isNavActive() && !transition()) {
        <div class="nav-item-text">Menu</div>
      }
    </div>
  }
</div>
