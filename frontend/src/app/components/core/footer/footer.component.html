<div
  class="footer"
  [ngClass]="{ active: isNavActive(), transition: !isNavActive() && transition() }"
>
  <!-- Nav system -->
  <div class="nav-container" [ngClass]="{ active: isNavActive(), transition: transition() }">
    <se-nav
      [isNavActive]="isNavActive()"
      [transition]="transition()"
      (toggleNavEmitter)="toggleNav($event)"
      (transitionEndEmitter)="onTransitionEnd()"
    ></se-nav>
  </div>

  <!-- Close Icon for when the nav is open -->
  @if (isNavActive() || transition()) {
    <i
      class="close-icon fa-solid fa-close fa-2xl clickable icon-button"
      (click)="toggleNav(false)"
    ></i>
  }
  <div class="nav-item-text">{{ navItemText() }}</div>
</div>
