<div class="selected-item-container">
  <!-- Delegate Name -->
  @if (!isMobile()) {
    <h2 class="title-text">
      {{ selectedDelegate().name }}
    </h2>
  }

  <!-- Delegate Status & Location  -->
  <div class="small-text-content">
    {{ selectedDelegate().delegateType }}
    @if (!isMobile()) {
      <span>- {{ selectedDelegate().state }}</span>
    }
  </div>

  <!-- Delegate Photo -->
  @if (selectedDelegate().photo) {
    <div class="photo-container">
      <!-- Keyed by the (memoized) photo URL so a new <img> is created 
       whenever a different delegate is selected - but not on every unrelated 
       change-detection run. -->
      @for (photo of photoAsArray(); track photo) {
        <img
          ngSrc="{{ photo }}"
          [width]="selectedDelegate().photoWidth"
          [height]="selectedDelegate().photoHeight"
          priority
          class="image medium-image"
        />
      }
    </div>
  }

  <!-- Short Delegate description -->
  @if (selectedDelegate().description) {
    <div class="small-text-content">
      <markdown [data]="selectedDelegate().description"></markdown>
    </div>
  }

  <!-- WCA Logo -->
  <a
    href="{{ enviroment.links.wcaProfile + selectedDelegate().wcaid }}"
    target="_blank"
    class="wca-logo-container"
  >
    <img ngSrc="assets/wca_logo.svg" width="293" height="293" class="wca-logo" />
  </a>
</div>
