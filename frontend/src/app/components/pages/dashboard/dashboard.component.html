<div class="component-container">
  <div class="main-pane" tabindex="0">
    <se-header
      id="header"
      [title]="'Dashboard'"
      [showNavCluster]="isMobile()"
      [dashboardControls]="true"
    ></se-header>
    <div class="large-text-content">Welcome, {{ authService.currentUser()?.name }}!</div>
    @if (isMobile()) {
      @for (tool of mobileTools(); track tool.routerLink) {
        <a class="btn tool-btn" [style.--tool-color]="tool.color" [routerLink]="tool.routerLink">
          {{ tool.label }}
          <i class="fa-solid {{ tool.icon }} fa-sm"></i>
        </a>
      }
    }
    @if (isMobile()) {
      <!-- TEMPORARY: the desktop sign-out (see below) doesn't exist on
      mobile - remove this once a permanent mobile placement is designed. -->
      <button
        type="button"
        class="btn sign-out"
        [disabled]="authService.isSigningOut()"
        (click)="signOut()"
      >
        {{ authService.isSigningOut() ? 'Signing out...' : 'Sign out' }}
        <i class="fa-solid fa-right-from-bracket fa-sm"></i>
      </button>
    }
  </div>
  @if (!isMobile()) {
    <se-dashboard-side-pane></se-dashboard-side-pane>
  }
</div>
