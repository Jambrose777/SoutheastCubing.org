<div
  class="deadline-banners-list"
  [class.has-visible-competitions]="visibleCompetitions().length > 0"
  [class.has-multiple-visible-competitions]="visibleCompetitions().length > 1"
>
  @for (competition of visibleCompetitions(); track competition.id) {
    <section class="deadline-banner" aria-label="WCA announcement deadline warning">
      <div class="banner-copy">
        <span class="banner-label">
          <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
          Missed WCA announcement deadline
        </span>
        <h2>{{ competition.name }}</h2>
        <p>This competition can no longer be announed on WCA.</p>
      </div>
      <div class="banner-actions">
        <button
          type="button"
          class="btn small"
          [disabled]="deletingCompetitionIds().has(competition.id)"
          (click)="deleteRequested.emit(competition)"
        >
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
          Delete
        </button>
        <button
          type="button"
          class="btn small"
          aria-label="Dismiss WCA announcement deadline warning"
          (click)="dismiss(competition)"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          Dismiss
        </button>
      </div>
    </section>
  }
</div>
