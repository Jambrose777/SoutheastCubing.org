<div class="side-pane" [class.collapsed]="dashboardLayout.isSidePaneCollapsed()">
  <se-header id="header" [showTitle]="false" [dashboardControls]="true"></se-header>

  @if (tools().length) {
    <div class="list-container" tabindex="0">
      @for (tool of tools(); track tool.routerLink) {
        <div
          class="item-container clickable"
          [style.--state-color]="tool.color"
          routerLinkActive="active"
        >
          <a
            class="item-row"
            [routerLink]="tool.routerLink"
            [queryParams]="queryParamsForTool(tool.routerLink)"
            (click)="onToolSelected(tool.routerLink)"
          >
            <div class="item-title">
              <span>{{ tool.label }}</span>
              <span class="item-title-end">
                @if (pendingItemFor()(tool.routerLink); as pendingItem) {
                  <span
                    class="notification-badge pending-badge"
                    [matTooltip]="pendingItem.label"
                    matTooltipPosition="above"
                    aria-label="{{ pendingItem.label }}"
                    >!</span
                  >
                }
                <i class="fa-solid {{ tool.icon }} fa-sm"></i>
              </span>
            </div>
          </a>
        </div>
      }
    </div>
  }
</div>

<!-- Sign-out button -->
<div class="side-pane-sign-out">
  <span class="btn" (click)="signOut()" role="button" tabindex="0" aria-label="Sign out">
    Sign out
    <i class="fa-solid fa-right-from-bracket fa-sm"></i>
  </span>
</div>
